name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'python/trustmark/**'
      - 'python/export-remover.py'
      - 'python/test-rust-removal.py'
      - 'python/pyproject.toml'
      - 'python/setup.py'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'python/trustmark/**'
      - 'python/export-remover.py'
      - 'python/test-rust-removal.py'
      - 'python/pyproject.toml'
      - 'python/setup.py'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Kept in sync with the platforms `ort` supports; see rust/README.md.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The ONNX model files are not in the repository; the tests load them
      # from `rust/models`. Cache them so we don't re-download ~230 MB per run.
      - name: Cache models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: rust/models
          key: trustmark-models-${{ hashFiles('rust/crates/xtask/src/main.rs') }}

      - name: Fetch models
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: cargo xtask fetch-models

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Doc tests
        run: cargo test --doc

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "Detected MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check against MSRV
        run: cargo check --workspace --all-targets

  removal:
    name: Removal model export and integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CPU-only wheels avoid downloading CUDA dependencies for model export.
      - name: Install PyTorch CPU
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install exporter dependencies
        run: python -m pip install ../python onnx onnxruntime

      - name: Cache removal models
        id: cache-removal-models
        uses: actions/cache@v4
        with:
          path: |
            rust/models
            python/trustmark/models
          key: trustmark-removal-models-${{ hashFiles('python/export-remover.py', 'rust/crates/xtask/src/main.rs', 'python/trustmark/**/*.py', 'python/pyproject.toml') }}

      - name: Fetch encoder and decoder models
        if: steps.cache-removal-models.outputs.cache-hit != 'true'
        run: cargo xtask fetch-models

      - name: Fetch published P and Q remover models
        if: steps.cache-removal-models.outputs.cache-hit != 'true'
        run: cargo xtask fetch-removers

      - name: Export and verify B and C remover variants
        if: steps.cache-removal-models.outputs.cache-hit != 'true'
        working-directory: python
        run: python export-remover.py --variant B --variant C

      - name: Test removal and re-watermarking
        run: cargo test --workspace --all-features -- --ignored

      - name: Build removal CLI for parity tests
        run: cargo build -p trustmark-cli

      - name: Compare native and Python crop and feather behavior
        working-directory: python
        run: python test-rust-removal.py

  package:
    name: Verify publishable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Catches problems that only show up in the packaged crate, such as files
      # excluded by .gitignore that the build actually needs.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked
